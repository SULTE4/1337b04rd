<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #E6E9F5;
        }

        header {
            text-align: center;
        }

        main {
            margin: 10px;
        }

        .post .header {
            display: flex;
            align-items: center;
        }

        .post .content {
            margin-top: 20px;
            display: flex;
        }

        .post .content img {
            width: 300px;
        }

        .text {

        }

        .comment .header {
            display: flex;
            align-items: center;
        }

        .comment .content {
            margin-top: 10px;
            display: flex;
        }
    </style>
</head>
<body>
<header>
    <h1>Thread Title</h1>
</header>
<main>
    <!-- Main Post -->
    <div class="post">
        <div class="header">
            <img src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" alt="no pic" width="50px" height="50px">
            {{humanDate .Post.Created}}
            {{.Post.ID}}
        </div>
        <div class="content">
            <a href="{{.Post.ImageURL}}">
                <img src="{{.Post.ImageURL}}" alt="no pic">
            </a>
            <div class="text">
                <h3>{{.Post.Title}}</h3>
                {{.Post.Content}}
            </div>
        </div>

    </div>
    <div class="comments">
        <ul class="comment-list">
            {{range .Comments}}
            <li class="comment">
                <div class="header">
                    <!-- there was user info take again from git -->
                    {{humanDate .Created}}
                    {{.CommentID}}
                </div>
                <div class="content">
                    <a href="{{.ImageURL}}">
                        <img src="{{.ImageURL}}" alt="no pic"  width="100px" height="100px">
                    </a>
                    <div class="text">
                        {{.Content}}
                    </div>
                </div>
            </li>
            {{end}}
        </ul>
    </div>
    <div class="add-comment">
        <h3>Add a Comment</h3>
        <form action="/submit-comment/{{.Post.ID}}" method="POST" enctype="multipart/form-data">
            <textarea name="comment" placeholder="Write your comment here..."></textarea>
            <tr>
                <td>File</td>
                <td>
                    <input name="file" type="file">
                </td>
            </tr>
            <br>
            <input type="submit" value="Submit">
        </form>
    </div>
</main>
</body>
</html>
