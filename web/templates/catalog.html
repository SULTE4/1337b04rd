<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1337b04rd - Catalog</title>
    <style>
        body {
            background-color: #E6E9F5;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header, footer {
            text-align: center;
            padding: 20px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #4A69BD;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            display: flex;
            justify-content: center;
            margin: 20px;
        }

        .posts {
            width: 90%;
        }

        .list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .post {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0px 3px 6px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            padding: 15px;
        }

        .post:hover {
            transform: translateY(-5px);
            box-shadow: 0px 6px 12px rgba(0,0,0,0.25);
        }
        .post img {
            max-width: 100%;
            max-height: 400px; /* limit vertical size */
            width: auto;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto; /* keeps centered */
        }


        .post h3 {
            font-size: 16px;
            margin: 10px 0 0;
            color: #333;
        }
    </style>
</head>
<body>
<header>
    <h1>1337b04rd</h1>
    <h2>Catalog</h2>
    <nav>
        [<a href="/post/create">Create Post</a>] |
        [<a href="/archive">Archive</a>]
    </nav>
</header>

<main>
    <section class="posts">
        <ul class="list">
            {{range .Posts}}
            <li class="post">
                <a href="/post/{{.ID}}">
                    {{if .ImageURL}}
                    <img src="{{.ImageURL}}" alt="preview">
                    {{else}}
                    <img src="https://via.placeholder.com/200x150?text=No+Image" alt="no pic">
                    {{end}}
                    <h3>{{.Title}}</h3>
                </a>
            </li>
            {{end}}
        </ul>
    </section>
</main>
</body>
</html>
