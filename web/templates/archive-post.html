<!-- templates/archive-post.html -->
<!DOCTYPE html>
<html>
<head>
    <!-- <link rel="stylesheet" href="../static/style.css"> -->
    <title>{{.Post.Title}} (Archived)</title>
    <style>
        .comment {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
        }
        .comment img.avatar {
            width: 50px;
            vertical-align: middle;
        }
        .comment-content {
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <a href="/archive">Back to Archive</a>
    <h1>{{.Post.Title}} (Archived)</h1>
    <p>{{.Post.Content}}</p>
    {{if .Post.ImageURL}}
        <img src="{{.Post.ImageURL}}" alt="Post Image" style="max-width: 100%; max-height: 400px; object-fit: contain;">
    {{end}}
    <p>Post ID: {{.Post.ID}}</p>
    <h2>Comments</h2>
    <div class="comments">
        {{range .Comments}}
        <div class="comment">
            <!-- remake with avater needed -->
            <div class="comment-content">
                <p><strong>Comment ID:</strong> {{.CommentID}}</p>
                <!-- need image , or recheck git repo templates -->
                <p>{{.Content}}</p>
            </div>
        </div>
        {{else}}
        <p>No comments available.</p>
        {{end}}
    </div>
<!-- Comment form is omitted since adding new comments is not allowed -->
</body>
</html>
