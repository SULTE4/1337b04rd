<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - 1337b04rd</title>
    <style>
        body {
            background-color: #E6E9F5;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 15px 0;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: blue;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .catalog-item {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 10px;
            transition: transform 0.2s;
        }

        .catalog-item:hover {
            transform: translateY(-4px);
        }

        .catalog-item img {
            max-width: 100%;
            max-height: 200px; /* limit image size */
            object-fit: contain;
            border-radius: 6px;
        }

        .catalog-title {
            font-size: 1.1em;
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>
<body>
<header>
    <h1>1337b04rd</h1>
    <h2>Catalog</h2>
    <nav>
        [<a href="/catalog">Catalog</a>] |
        [<a href="/post/create">Create Post</a>]
    </nav>
</header>

<main>
    <section class="catalog-grid">
        {{range .Posts}}
        <div class="catalog-item">
            <a href="archive/post/{{.ID}}">
                {{if .ImageURL}}
                    <img src="{{.ImageURL}}" alt="{{.Title}}">
                {{end}}
                <div class="catalog-title">{{.Title}}</div>
            </a>
        </div>
        {{end}}
    </section>
</main>
</body>
</html>
